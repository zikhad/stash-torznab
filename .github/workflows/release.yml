name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Configure Git user
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Create release commit and tag
        run: npm run release

      - name: Capture release tag
        id: release_tag
        run: echo "value=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT

      - name: Push release commit and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push --follow-tags origin HEAD

  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    with:
      git_ref: ${{ needs.release.outputs.release_tag }}
      image_tag: ${{ needs.release.outputs.release_tag }}
    secrets: inherit
